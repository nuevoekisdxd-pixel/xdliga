<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Partidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="menu-principal">
        <div class="barra-navegacion-interna">
            <!-- Logotipo a la izquierda -->
            <a href="index.html" class="enlace-logo">
                <img src="logos/xd-liga.png" alt="Logotipo Oficial de la Liga" class="logo-liga-encabezado">
            </a>

            <!-- Tu menú original en lista -->
            <ul>
                <li><a href="equipos.html">Equipos</a></li>
                <li><a href="mapa.html">Mapa</a></li>
                <li><a href="historial.html">Historial de partidos</a></li>
                <li><a href="tabla-historica.html">Tablas históricas</a></li>
                <li><a href="acerca.html">Acerca de nosotros</a></li>
            </ul>
        </div>
    </nav>

    <main class="contenido">
        <h1>Historial de Partidos</h1>
        <p>Resultados detallados de los encuentros disputados en el simulador.</p>

        <!-- ========================================== -->
        <!-- SECCIÓN 1: HISTORIAL GLOBAL DE TODOS LOS PARTIDOS -->
        <!-- ========================================== -->
        <section class="seccion-historial-modulo">
            <h2>Todos los Partidos</h2>
            <div class="controles-historial">
                <div class="control-grupo">
                    <label for="filtro-orden">Orden:</label>
                    <select id="filtro-orden">
                        <option value="recientes" selected>Más recientes primero</option>
                        <option value="antiguos">Más antiguos primero</option>
                    </select>
                </div>
                <div class="control-grupo">
                    <label for="filtro-limite">Mostrar:</label>
                    <select id="filtro-limite">
                        <option value="10" selected>10 partidos</option>
                        <option value="20">20 partidos</option>
                        <option value="50">50 partidos</option>
                        <option value="todos">Todos los partidos</option>
                    </select>
                </div>
            </div>
            <section id="contenedor-partidos" class="lista-partidos"></section>
        </section>

        <!-- ========================================== -->
        <!-- SECCIÓN 2: HISTORIAL ESPECÍFICO DE UN CLUB -->
        <!-- ========================================== -->
        <section class="seccion-historial-modulo bloque-separador">
            <h2>Historial por Equipo</h2>
            <div class="control-filtros-mixtos">
                <div class="control-grupo">
                    <label for="selector-club-propio">Selecciona un Equipo:</label>
                    <select id="selector-club-propio">
                        <option value="">-- Selecciona --</option>
                    </select>
                </div>
                <div class="control-grupo">
                    <label for="filtro-orden-propio">Orden:</label>
                    <select id="filtro-orden-propio">
                        <option value="recientes" selected>Más recientes primero</option>
                        <option value="antiguos">Más antiguos primero</option>
                    </select>
                </div>
                <div class="control-grupo">
                    <label for="filtro-limite-propio">Mostrar:</label>
                    <select id="filtro-limite-propio">
                        <option value="5" selected>5 partidos</option>
                        <option value="10">10 partidos</option>
                        <option value="todos">Todos</option>
                    </select>
                </div>
            </div>
            <section id="contenedor-partidos-propio" class="lista-partidos"></section>
        </section>

        <!-- ========================================== -->
        <!-- SECCIÓN 3: ENFRENTAMIENTO DIRECTO (H2H) -->
        <!-- ========================================== -->
        <section class="seccion-historial-modulo bloque-separador">
            <h2>Historial Frente a Frente (H2H)</h2>
            <div class="control-filtros-mixtos">
                <div class="control-grupo">
                    <label for="selector-h2h-A">Equipo A:</label>
                    <select id="selector-h2h-A"><option value="">-- Selecciona --</option></select>
                </div>
                <div class="control-grupo">
                    <label for="selector-h2h-B">Equipo B:</label>
                    <select id="selector-h2h-B"><option value="">-- Selecciona --</option></select>
                </div>
                <div class="control-grupo">
                    <label for="filtro-orden-h2h">Orden:</label>
                    <select id="filtro-orden-h2h">
                        <option value="recientes" selected>Más recientes primero</option>
                        <option value="antiguos">Más antiguos primero</option>
                    </select>
                </div>
                <div class="control-grupo">
                    <label for="filtro-limite-h2h">Mostrar:</label>
                    <select id="filtro-limite-h2h">
                        <option value="5" selected>5 partidos</option>
                        <option value="10">10 partidos</option>
                        <option value="todos">Todos</option>
                    </select>
                </div>
            </div>
            
            <div id="estadisticas-h2h" class="bloque-estadisticas" style="display: none; margin-bottom: 20px;"></div>
            <section id="contenedor-partidos-h2h" class="lista-partidos"></section>
        </section>

    </main>

    <script src="app.js"></script>

    <footer class="pie-pagina">
        <img src="logos/xd-liga.png" alt="Logotipo Oficial de la Liga" class="logo-liga-pie">
    </footer>

</body>
</html>
