<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Técnica del Equipo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="menu-principal">
        <div class="barra-navegacion-interna">
            <!-- Logotipo a la izquierda -->
            <a href="index.html" class="enlace-logo">
                <img src="logos/xd-liga.png" alt="Logotipo Oficial de la Liga" class="logo-liga-encabezado">
            </a>

            <!-- Tu menú original en lista -->
            <ul>
                <li><a href="equipos.html">Equipos</a></li>
                <li><a href="mapa.html">Mapa</a></li>
                <li><a href="historial.html">Historial de partidos</a></li>
                <li><a href="tabla-historica.html">Tablas históricas</a></li>
                <li><a href="acerca.html">Acerca de nosotros</a></li>
            </ul>
        </div>
    </nav>

    <main class="contenido-perfil" id="perfil-cargar">
        <a href="equipos.html" class="boton-volver">&larr; Volver a la lista</a>
        
        <!-- CORREGIDO: Usaremos este ID tanto en el HTML como en el JS -->
        <div id="contenedor-perfil" class="perfil-equipo">
            <p>Cargando datos del club...</p>
        </div>

        <div id="contenedor-estadisticas" class="bloque-estadisticas">
            <!-- JavaScript inyectará el resumen de rendimiento aquí -->
        </div>
    </main>

    <script>
        const parametrosURL = new URLSearchParams(window.location.search);
        const equipoId = parametrosURL.get('id');

        Promise.all([
          fetch('equipos.json').then(res => res.json()),
          fetch('partidos.json').then(res => res.json())
        ])
        .then(([equipos, partidos]) => {
          const club = equipos.find(e => e.id === equipoId);
          if (!club) {
            document.body.innerHTML = "<h1>Equipo no encontrado</h1>";
            return;
          }

          // 1. RENDERIZAR INFORMACIÓN PRINCIPAL DEL CLUB
          const contenedorPerfil = document.getElementById('contenedor-perfil');
          contenedorPerfil.innerHTML = `
              <img src="logos/${club.logo}" alt="Logo" class="logo-grande">
              <h1>${club.nombre}</h1>
              <p class="apodo-perfil">"${club.apodo}"</p>
              <table class="tabla-datos">
                  <tr><th>Fundación</th><td>${club.fundacion}</td></tr>
                  <tr><th>Estadio</th><td>${club.estadio}</td></tr>
                  <tr><th>Capacidad</th><td>${club.capacidad.toLocaleString()} espectadores</td></tr>
                  <tr><th>Ubicación</th><td>${club.ubicacion}</td></tr>
                  <tr><th>División Actual</th><td>${club.division}</td></tr>
              </table>
          `;

          // 2. CALCULAR RENDIMIENTO HISTÓRICO GENERAL
          let pj = 0, pg = 0, pe = 0, pp = 0, gf = 0, gc = 0, puntos = 0;

          partidos.forEach(partido => {
              const esLocal = partido.local.id === equipoId;
              const esVisitante = partido.visitante.id === equipoId;

              if (!esLocal && !esVisitante) return; 

              pj += 1;
              const golesLocales = partido.local.goles;
              const golesVisitantes = partido.visitante.goles;

              if (esLocal) {
                  gf += golesLocales;
                  gc += golesVisitantes;
                  if (golesLocales > golesVisitantes) { pg += 1; puntos += 3; }
                  else if (golesLocales < golesVisitantes) { pp += 1; }
                  else { pe += 1; puntos += 1; }
              } else {
                  gf += golesVisitantes;
                  gc += golesLocales;
                  if (golesVisitantes > golesLocales) { pg += 1; puntos += 3; }
                  else if (golesVisitantes < golesLocales) { pp += 1; }
                  else { pe += 1; puntos += 1; }
              }
          });

          const dg = gf - gc;
          const puntosPosibles = pj * 3;
          const efectividad = puntosPosibles > 0 ? ((puntos / puntosPosibles) * 100).toFixed(1) : "0.0";

          // 3. RENDERIZAR TABLA DE METRICAS EN EL PANEL
          const contenedorEstadisticas = document.getElementById('contenedor-estadisticas');
          contenedorEstadisticas.innerHTML = `
              <h2>Rendimiento Histórico General</h2>
              <div class="tarjeta-rendimiento-grid">
                  <div class="item-metrica"><strong>PJ</strong><span>${pj}</span><label>Jugados</label></div>
                  <div class="item-metrica"><strong>PG</strong><span>${pg}</span><label>Ganados</label></div>
                  <div class="item-metrica"><strong>PE</strong><span>${pe}</span><label>Empatados</label></div>
                  <div class="item-metrica"><strong>PP</strong><span>${pp}</span><label>Perdidos</label></div>
                  <div class="item-metrica"><strong>GF</strong><span>${gf}</span><label>A Favor</label></div>
                  <div class="item-metrica"><strong>GC</strong><span>${gc}</span><label>En Contra</label></div>
                  <div class="item-metrica"><strong>DG</strong><span class="${dg > 0 ? 'pos' : dg < 0 ? 'neg' : ''}">${dg > 0 ? '+' + dg : dg}</span><label>Diferencia</label></div>
                  <div class="item-metrica destacada"><strong>EFECTIVIDAD</strong><span>${efectividad}%</span><label>${puntos} pts de ${puntosPosibles}</label></div>
              </div>
          `;
        })
        .catch(error => console.error("Error al generar la ficha técnica:", error));
    </script>

    <footer class="pie-pagina">
        <img src="logos/xd-liga.png" alt="Logotipo Oficial de la Liga" class="logo-liga-pie">
    </footer>

</body>
</html>
